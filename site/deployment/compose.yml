name: maccare
services:
  site:
    image: nginx:1.30.6-alpine
    container_name: maccare-site
    restart: unless-stopped
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [proxy]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik
      traefik.http.routers.maccare.rule: Host(`maccare.homeblack.fr`)
      traefik.http.routers.maccare.entrypoints: websecure,manager
      traefik.http.routers.maccare.tls: "true"
      traefik.http.routers.maccare.tls.certresolver: letsencrypt
      traefik.http.routers.maccare.tls.domains[0].main: homeblack.fr
      traefik.http.routers.maccare.tls.domains[0].sans: "*.homeblack.fr"
      traefik.http.routers.maccare.service: maccare
      traefik.http.services.maccare.loadbalancer.server.port: "8080"
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
networks:
  proxy:
    external: true
    name: traefik
