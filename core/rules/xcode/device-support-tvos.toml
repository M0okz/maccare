# Symboles d'appareils tvOS téléchargés par Xcode, un dossier par version.
# À revoir : retéléchargés à la prochaine connexion d'un appareil concerné (parfois long).

id = "xcode.device-support-tvos"
category = "xcode-devicesupport-tvos"
version = 1
root = "~/Library/Developer/Xcode/tvOS DeviceSupport"
depth = "per-app"
autoselect = false
title = "Supports d'appareils tvOS"
description = "Symboles tvOS retéléchargés automatiquement à la prochaine connexion d'un appareil."
risk = "review"
audience = "developer"
icon = "hammer.fill"

[[exclude]]
kind = "name"
equals = ".DS_Store"
