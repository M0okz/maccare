# Symboles d'appareils macOS téléchargés par Xcode, un dossier par version.
# À revoir : retéléchargés à la prochaine connexion d'un appareil concerné (parfois long).

id = "xcode.device-support-macos"
category = "xcode-devicesupport-macos"
version = 1
root = "~/Library/Developer/Xcode/macOS DeviceSupport"
depth = "per-app"
autoselect = false
title = "Supports d'appareils macOS"
description = "Symboles macOS retéléchargés automatiquement à la prochaine connexion d'un appareil."
risk = "review"
audience = "developer"
icon = "hammer.fill"

[[exclude]]
kind = "name"
equals = ".DS_Store"
