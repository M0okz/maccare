# Symboles d'appareils visionOS téléchargés par Xcode, un dossier par version.
# À revoir : retéléchargés à la prochaine connexion d'un appareil concerné (parfois long).

id = "xcode.device-support-visionos"
category = "xcode-devicesupport-visionos"
