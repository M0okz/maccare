name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Moteur Rust macOS
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: cargo test --locked --manifest-path core/Cargo.toml
      - run: python3 -m unittest discover -s app/release/tests -v

  macos:
    name: App et DMG Apple Silicon
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Vérifier le runner Apple Silicon
        run: test "$(uname -m)" = arm64
      - name: Construire depuis les sources
        run: bash app/build.sh
      - name: Tests Swift
        run: swift test --package-path app --build-system swiftbuild -Xlinker -L"$PWD/core/target/release"
      - name: Tester les outils de release et les signatures Sparkle
        run: |
          python3 -m unittest discover -s app/release/tests -v
          python3 app/release/test_signatures.py
      - name: Générer le DMG de validation (sans certificat de distribution)
        run: bash app/create-dmg.sh --skip-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacCare-arm64-ci
          path: |
            build/MacCare-*-arm64.dmg
            build/MacCare-*-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
